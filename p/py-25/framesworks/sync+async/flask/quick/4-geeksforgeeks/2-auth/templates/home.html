<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <style>
      h1 {
        color: green;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        {% if current_user.is_authenticated %}
            <li><a href="/logout">Logout</a></li>
        {% else %}
            <li><a href="/login">Login</a></li>
            <li><a href="/register">Create account</a></li>
        {% endif %}
      </ul>
    </nav>
    {% if current_user.is_authenticated %}
    <h1>You are logged in </h1>
    <a href="/logout">Logout</a>
    {% else %}
    <h1>You are not logged in</h1>
    {% endif %}
  </body>
</html>
